<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo · Live Console</title><style>body{font:16px system-ui;margin:auto;max-width:1100px;padding:2rem;background:#10131a;color:#f5f7fa}input,select,button,textarea{padding:.55rem;margin:.2rem}button{cursor:pointer}main{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.card{background:#1b2130;padding:1rem;border-radius:.6rem}label{display:block;margin:.3rem 0}li{padding:.5rem;border-bottom:1px solid #394052}small{color:#afbdd1}pre{white-space:pre-wrap;max-height:260px;overflow:auto}dialog{max-width:700px;width:90%}</style><body><nav><a href="/" style="color:#9cd">← Console legado</a></nav><h1>Catálogo de músicas</h1><p id="status" role="status">Carregando…</p><main><section class="card"><h2>Pesquisar e filtrar</h2><input id="q" placeholder="Título ou artista"><select id="statusFilter"><option value="">Todos os status</option><option>OK</option><option>Estudar</option></select><select id="autoral"><option value="">Autoral e não autoral</option><option value="true">Autoral</option><option value="false">Não autoral</option></select><button onclick="load()">Pesquisar</button><button onclick="edit()">Nova música</button><ul id="list"></ul></section><section class="card"><h2>Importar / exportar</h2><input id="import" type="file" accept="application/json,.json"><button onclick="preview()">Visualizar prévia</button><label><input id="partial" type="checkbox"> permitir itens válidos quando houver rejeitados</label><button id="confirm" onclick="confirmImport()" disabled>Confirmar importação</button><button onclick="exportCatalog()">Baixar exportação</button><pre id="report"></pre><h2>Detalhe</h2><div id="detail">Selecione ou cadastre uma música.</div></section></main><dialog id="form"><form method="dialog"><h2 id="formTitle">Música</h2><label>Artista <input name="artista" required></label><label>Título <input name="titulo" required></label><label>Status <input name="status"></label><label>Bloco <input name="bloco"></label><label>Clima <input name="clima"></label><label><input name="autoral" type="checkbox"> Autoral</label><label>Observações <textarea name="observacoes"></textarea></label><button value="cancel">Cancelar</button><button id="save" value="default">Salvar</button></form></dialog><script>
let selected, pending;const $=id=>document.getElementById(id);async function api(path,opt){const r=await fetch('/api'+path,{headers:{'Content-Type':'application/json'},...opt});if(r.status===204)return null;const d=await r.json();if(!r.ok)throw Error(d.error);return d}function msg(s){$('status').textContent=s}async function load(){try{msg('Carregando…');let qs=new URLSearchParams();for(const [k,v]of [['q',$('q').value],['status',$('statusFilter').value],['autoral',$('autoral').value]])if(v)qs.set(k,v);let d=await api('/musicas?'+qs);$('list').innerHTML=d.musicas.map(m=>`<li><button onclick="show('${m.id}')">${esc(m.artista)} — ${esc(m.titulo)}</button><small>${m.fontes.length} referências</small></li>`).join('')||'<li>Sem músicas.</li>';msg(`${d.musicas.length} música(s)`)}catch(e){msg(e.message)}}function esc(x){return String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}async function show(id){selected=(await api('/musicas/'+id)).musica;const sources=selected.fontes.map(f=>`<li>${f.principal?'★':'○'} ${esc(f.nome)} (${f.tipo}) <button onclick="primary('${f.id}')">principal</button><button onclick="delSource('${f.id}')">desvincular</button></li>`).join('');$('detail').innerHTML=`<b>${esc(selected.artista)} — ${esc(selected.titulo)}</b><p>Letra: ${esc(selected.letra_caminho||'nenhuma')}</p><button onclick="edit()">Editar</button><button onclick="delMusic()">Excluir</button><h3>Referências</h3><ul>${sources}</ul><input id="sourceName" placeholder="Nome"><select id="sourceType"><option>youtube</option><option>audio</option><option>video</option></select><input id="sourceRef" placeholder="URL ou referência"><button onclick="addSource()">Adicionar YouTube/referência</button><p>Upload <input id="upload" type="file"><button onclick="uploadFile()">Enviar</button></p><p>Letra <input id="lyrics" type="file" accept=".txt,.md"><button onclick="uploadLyrics()">Enviar e associar</button><button onclick="unlinkLyrics()">Desvincular letra</button></p>`}function edit(){let f=$('form').querySelector('form');for(let e of f.elements)if(e.name)e.value='';if(selected){for(let k of ['artista','titulo','status','bloco','clima','observacoes'])f.elements[k].value=selected[k]||'';f.elements.autoral.checked=selected.autoral}$('form').showModal()}$('save').onclick=async e=>{e.preventDefault();let f=$('form').querySelector('form'),p=Object.fromEntries(new FormData(f));p.autoral=f.elements.autoral.checked;try{let r=selected?await api('/musicas/'+selected.id,{method:'PATCH',body:JSON.stringify(p)}):await api('/musicas',{method:'POST',body:JSON.stringify(p)});selected=r.musica;$('form').close();await load();show(selected.id)}catch(e){alert(e.message)}};async function delMusic(){if(confirm('Excluir cadastro? Arquivos físicos serão preservados.')){await api('/musicas/'+selected.id,{method:'DELETE'});selected=null;$('detail').textContent='Excluída.';load()}}async function addSource(){await api('/musicas/'+selected.id+'/fontes',{method:'POST',body:JSON.stringify({nome:$('sourceName').value||'Referência',tipo:$('sourceType').value,referencia:$('sourceRef').value})});show(selected.id)}async function primary(id){await api('/musicas/'+selected.id+'/fontes/principal',{method:'PUT',body:JSON.stringify({id})});show(selected.id)}async function delSource(id){await api('/musicas/'+selected.id+'/fontes/'+id,{method:'DELETE'});show(selected.id)}async function uploadOne(file,kind){let fd=new FormData();fd.append('arquivo',file);let r=await fetch('/api/uploads/'+kind,{method:'POST',body:fd});let d=await r.json();if(!r.ok)throw Error(d.error);return d.referencia}async function uploadFile(){let f=$('upload').files[0];if(!f)return;let kind=/^video\//.test(f.type)?'video':'audio',ref=await uploadOne(f,kind);await api('/musicas/'+selected.id+'/fontes',{method:'POST',body:JSON.stringify({nome:f.name,tipo:kind,referencia:ref})});show(selected.id)}async function uploadLyrics(){let f=$('lyrics').files[0];if(!f)return;let ref=await uploadOne(f,'letras');await api('/musicas/'+selected.id+'/letra',{method:'PUT',body:JSON.stringify({referencia:ref})});show(selected.id)}async function unlinkLyrics(){await api('/musicas/'+selected.id+'/letra',{method:'DELETE'});show(selected.id)}async function preview(){let f=$('import').files[0];if(!f)return msg('Escolha um JSON');pending=JSON.parse(await f.text());let r=await api('/importacao/previa',{method:'POST',body:JSON.stringify(pending)});$('report').textContent=JSON.stringify(r.relatorio,null,2);$('confirm').disabled=false}async function confirmImport(){let r=await api('/importacao/confirmar',{method:'POST',body:JSON.stringify({payload:pending,partial:$('partial').checked})});$('report').textContent=JSON.stringify(r.relatorio,null,2);load()}async function exportCatalog(){let r=await fetch('/api/exportacao'),b=new Blob([await r.text()],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='catalogo.json';a.click();URL.revokeObjectURL(a.href)}load();
</script></body></html>
