<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Blocos reutilizáveis</title><body><h1>Blocos reutilizáveis</h1><p>O campo histórico <code>bloco</code> do catálogo não é alterado por esta tela.</p><div id="app">Carregando…</div><script>const app=document.querySelector('#app');let current;async function api(p,o={}){const r=await fetch('/api'+p,{headers:{'content-type':'application/json'},...o});if(r.status===204)return null;const x=await r.json();if(!r.ok)throw Error(x.error);return x}async function render(){const {blocos}=await api('/blocos');app.innerHTML=`<button id="new">Novo bloco</button><ul>${blocos.map(b=>`<li><button data-id="${b.id}">${b.nome}</button> (${b.quantidade_musicas}) <button data-del="${b.id}">Excluir</button></li>`).join('')}</ul><div id="detail"></div>`;document.querySelector('#new').onclick=async()=>{const nome=prompt('Nome do bloco');if(nome){await api('/blocos',{method:'POST',body:JSON.stringify({nome})});render()}};app.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>open(x.dataset.id));app.querySelectorAll('[data-del]').forEach(x=>x.onclick=async()=>{if(confirm('Excluir somente o bloco e seus vínculos?')){await api('/blocos/'+x.dataset.del,{method:'DELETE'});render()}})}async function open(id){current=(await api('/blocos/'+id)).bloco;const d=document.querySelector('#detail');d.innerHTML=`<h2>${current.nome}</h2><button id="rename">Editar</button><input id="q" placeholder="Pesquisar música"><button id="search">Buscar</button><ul>${current.musicas.map((m,i)=>`<li>${i+1}. ${m.artista} — ${m.titulo} <button data-remove="${m.id}">Remover</button></li>`).join('')}</ul><ul id="results"></ul>`;d.querySelector('#rename').onclick=async()=>{const nome=prompt('Nome',current.nome);if(nome){await api('/blocos/'+id,{method:'PATCH',body:JSON.stringify({nome})});open(id)}};d.querySelector('#search').onclick=async()=>{const ms=(await api('/musicas?q='+encodeURIComponent(d.querySelector('#q').value))).musicas;d.querySelector('#results').innerHTML=ms.map(m=>`<li>${m.artista} — ${m.titulo}<button data-add="${m.id}">Adicionar</button></li>`).join('');d.querySelectorAll('[data-add]').forEach(b=>b.onclick=async()=>{try{await api('/blocos/'+id+'/musicas',{method:'POST',body:JSON.stringify({musicaId:b.dataset.add})});open(id)}catch(e){alert(e.message)}})};d.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{await api('/blocos/'+id+'/musicas/'+b.dataset.remove,{method:'DELETE'});open(id)})}render()</script></body></html>
