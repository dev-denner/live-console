<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Execução de live</title><body><h1>Execução de live</h1><div id="app">Carregando…</div><script>const app=document.querySelector('#app');async function api(p,o={}){const r=await fetch('/api'+p,{headers:{'content-type':'application/json'},...o});const x=await r.json();if(!r.ok)throw Error(x.error);return x}async function render(){const lives=(await api('/lives')).lives;app.innerHTML=`<select id="live"><option>Selecione a live</option>${lives.map(x=>`<option value="${x.id}">${x.titulo}</option>`).join('')}</select><button id="open">Abrir</button><pre id="out"></pre>`;document.querySelector('#open').onclick=async()=>{const id=document.querySelector('#live').value;const x=await api('/lives/'+id+'/execucao');document.querySelector('#out').textContent=JSON.stringify(x,null,2)}}render()</script></body></html>
