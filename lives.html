<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Montador manual de lives</title><body><h1>Montador manual de lives</h1><p>Crie rascunhos, selecione músicas do catálogo e exporte repertórios compatíveis.</p><div id="app">Carregando…</div><script>const app=document.querySelector('#app');let live;async function api(p,o={}){const r=await fetch('/api'+p,{headers:{'content-type':'application/json'},...o});if(r.status===204)return null;const x=await r.json();if(!r.ok)throw Error(x.error);return x}async function render(){const ls=(await api('/lives')).lives;app.innerHTML=`<button id="new">Nova live</button><ul>${ls.map(x=>`<li><button data-id="${x.id}">${x.titulo}</button> (${x.itens.length})</li>`).join('')}</ul><input id="q" placeholder="Pesquisar catálogo"><button id="search">Pesquisar</button><ul id="songs"></ul><pre id="out"></pre>`;document.querySelector('#new').onclick=async()=>{const titulo=prompt('Título da live');if(titulo){live=(await api('/lives',{method:'POST',body:JSON.stringify({titulo})})).live;render()}};app.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{live=(await api('/lives/'+b.dataset.id)).live;show()});document.querySelector('#search').onclick=search}async function search(){const ms=(await api('/musicas?q='+encodeURIComponent(document.querySelector('#q').value))).musicas;document.querySelector('#songs').innerHTML=ms.map(m=>`<li>${m.artista} — ${m.titulo}<button data-m="${m.id}">Adicionar</button></li>`).join('');document.querySelectorAll('[data-m]').forEach(b=>b.onclick=async()=>{if(!live)return alert('Abra uma live');const m=ms.find(x=>x.id===b.dataset.m),f=m.fontes[0];if(!f)return alert('Música sem referência');await api('/lives/'+live.id+'/itens',{method:'POST',body:JSON.stringify({musicaId:m.id,referenciaReproducao:f.referencia,tipoReproducao:f.tipo})});live=(await api('/lives/'+live.id)).live;show()})}function show(){document.querySelector('#out').textContent=JSON.stringify(live,null,2)}render()</script></body></html>
